services:
  fastone_database:
    image: postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  fastone_app:
    image: fastone_app
    build: .
    entrypoint: ./entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      - fastone_database
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@fastone_database:5432/app_db
volumes:
  pgdata: